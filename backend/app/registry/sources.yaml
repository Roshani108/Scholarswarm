# Curated Registry of Official Scholarship and University Portals
# Used as fallback or search seeding if external search engines are throttled or fail.

portals_by_country:
  Canada:
    - name: "Vanier Canada Graduate Scholarships"
      url: "https://vanier.gc.ca/en/home-accueil.html"
      type: "Government Fellowship"
      level: "Doctoral / Direct entry from Master's"
      funding: "CAD $50,000 per year"
      field: "Health, Natural sciences & engineering, Social sciences"
      eligibility_summary: "First-class average (equivalent to 80% or A-), nomination by Canadian institution"
    - name: "University of Toronto - Faculty of Arts & Science Graduate Fellowships"
      url: "https://www.artsci.utoronto.ca/graduate/graduate-funding"
      type: "University Fellowship"
      level: "Master's & Ph.D."
      funding: "Full funding package covering tuition + living stipend minimum CAD $23,000"
      field: "Computer Science, Data Science, Sciences"
      eligibility_summary: "Minimum B+ (approx 3.3/4.0 or 77%) in final two years of undergraduate study"
    - name: "UBC Graduate Global Leadership Fellowships"
      url: "https://www.grad.ubc.ca/awards/international-tuition-award"
      type: "University Award"
      level: "Master's & Ph.D."
      funding: "CAD $3,200/yr tuition award + departmental RA/TA funding"
      field: "All fields"
      eligibility_summary: "Full-time international research master's or PhD student in good academic standing"
    - name: "Ontario Graduate Scholarship (OGS)"
      url: "https://osap.gov.on.ca/OSAPPortal/en/A-ZListofAwards/PRDR022718.html"
      type: "Provincial Government"
      level: "Master's & Ph.D."
      funding: "CAD $15,000 for one year (three consecutive terms)"
      field: "All graduate fields"
      eligibility_summary: "Minimum A- (80%) average across last two academic years"
    - name: "Waterloo International Master's Award of Excellence"
      url: "https://uwaterloo.ca/graduate-studies-postdoctoral-affairs/awards/international-masters-award-excellence-imae"
      type: "University Fellowship"
      level: "Master's (Research-based)"
      funding: "CAD $2,500 per term for up to 5 terms ($12,500 total)"
      field: "Mathematics, Computer Science, Engineering"
      eligibility_summary: "Outstanding academic record (minimum 80% / 3.7 GPA), research program admission"

  Germany:
    - name: "DAAD Development-Related Postgraduate Courses (EPOS)"
      url: "https://www.daad.de/en/information-services-for-higher-education-institutions/further-information-on-daad-programmes/epos/"
      type: "Government Scholarship"
      level: "Master's"
      funding: "€934 monthly stipend + travel allowance + health insurance"
      field: "Engineering, Informatics, Sustainable Development, Public Health"
      eligibility_summary: "Bachelor's degree with above-average grades, minimum 2 years relevant work/internship experience"
    - name: "DAAD Helmut-Schmidt-Programme (Public Policy & Good Governance)"
      url: "https://www.daad.de/en/find-funding/scholarship-database/?type=a&detail=50026397"
      type: "Government Scholarship"
      level: "Master's"
      funding: "€934 per month + insurance + travel grants"
      field: "Social Sciences, Political Science, Law, Economics"
      eligibility_summary: "First degree completed with above-average results (upper third)"
    - name: "TU Munich - Master's Programs with Zero/Low Tuition & Department Scholarships"
      url: "https://www.tum.de/en/studies/fees-and-financial-aid/scholarships"
      type: "University & State"
      level: "Master's"
      funding: "Merit-based semester grants €500 - €1,500 / month, research assistantships"
      field: "Informatics, Data Engineering, AI, Mechanical Engineering"
      eligibility_summary: "Recognized Bachelor's degree, aptitude assessment (curricular match + GPA)"
    - name: "Heinrich Böll Foundation Scholarships"
      url: "https://www.boell.de/en/foundation-scholarships"
      type: "Foundation Fellowship"
      level: "Master's & Ph.D."
      funding: "€934 per month + €300 book allowance"
      field: "All subjects (STEM, Social Sciences, Arts)"
      eligibility_summary: "Excellent academic record, active socio-political or community engagement"
    - name: "Deutschlandstipendium National Scholarship Programme"
      url: "https://www.deutschlandstipendium.de/deutschlandstipendium/en"
      type: "Federal Government & Private Sponsors"
      level: "Bachelor's & Master's"
      funding: "€300 per month (€150 federal + €150 private)"
      field: "All disciplines at participating German universities"
      eligibility_summary: "Outstanding academic performance and personal achievements"

  Singapore:
    - name: "Singapore International Graduate Award (SINGA)"
      url: "https://www.a-star.edu.sg/Scholarships/for-graduate-studies/singapore-international-graduate-award-singa"
      type: "Government / A*STAR Fellowship"
      level: "Ph.D. / Direct Ph.D."
      funding: "Full tuition coverage + SGD $2,700 - $3,200 monthly stipend + SGD $1,000 settling-in + SGD $1,500 airfare"
      field: "Biomedical Sciences, Physical Sciences, Computing & Engineering"
      eligibility_summary: "Graduates with passion for research and excellent academic results, good English skills"
    - name: "NUS Research Scholarship"
      url: "https://nusgs.nus.edu.sg/scholarships-financial-aid/"
      type: "University Scholarship"
      level: "Master's by Research & Ph.D."
      funding: "Full tuition fee subsidy + monthly stipend SGD $2,200 - $2,800"
      field: "Computer Science, AI, Engineering, Life Sciences, Business"
      eligibility_summary: "Graduates with at least 2nd Class Honours (Upper) or equivalent (CGPA >= 8.0/10)"
    - name: "NTU Research Scholarship"
      url: "https://www.ntu.edu.sg/admissions/graduate/financial-matters/scholarships/ntu-research-scholarship"
      type: "University Scholarship"
      level: "Master's by Research & Ph.D."
      funding: "Tuition waiver + SGD $2,200 - $2,700 monthly stipend"
      field: "Computer Science, Data Science, Engineering, Physical Sciences"
      eligibility_summary: "First Class or Upper Second Class Honours degree or equivalent academic standing"
    - name: "SMU Master's by Research Scholarship"
      url: "https://graduatestudies.smu.edu.sg/scholarships"
      type: "University Scholarship"
      level: "Master's by Research"
      funding: "Full tuition fee waiver + monthly stipend up to SGD $2,000"
      field: "Information Systems, Computing, Economics"
      eligibility_summary: "Strong quantitative background and solid bachelor's academic performance"

  Europe:
    - name: "Erasmus Mundus Joint Master Degrees (EMJMD)"
      url: "https://erasmus-plus.ec.europa.eu/opportunities/opportunities-for-individuals/students/erasmus-mundus-joint-masters"
      type: "European Commission Fellowship"
      level: "Master's"
      funding: "100% tuition waiver + €1,400 monthly living allowance + travel and installation costs"
      field: "Artificial Intelligence, Data Science, European Studies, Environmental Sciences"
      eligibility_summary: "First higher education degree or demonstrated equivalent, proficiency in English"
