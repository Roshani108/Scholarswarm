services:
  # 1. FastAPI Multi-Agent Backend Web Service
  - type: web
    name: scholarswarm-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ENABLE_CACHE
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Vite React Frontend Static Site
  - type: web
    name: scholarswarm-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: scholarswarm-backend
          property: host
