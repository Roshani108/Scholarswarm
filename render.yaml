services:
  # Unified ScholarSwarm Web Application (Full Frontend UI + Multi-Agent AI Backend)
  - type: web
    name: scholarswarm
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ENABLE_CACHE
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0
